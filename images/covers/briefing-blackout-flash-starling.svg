<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1023"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f4a"/>
      <stop offset="100%" stop-color="#1a1d35"/>
    </linearGradient>
    <linearGradient id="redX" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5e5e"/>
      <stop offset="100%" stop-color="#c92727"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee0ff"/>
      <stop offset="100%" stop-color="#3aa8ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee0a3"/>
      <stop offset="100%" stop-color="#2bb673"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- title strip -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#ffffff">
    <text x="40" y="58" font-size="26" font-weight="700">黑色星期四 · AI 集体宕机</text>
    <text x="40" y="86" font-size="14" fill="#9aa3c7">2026-09-03 · 编程模型三强同日发布 · 具身商业化首单</text>
  </g>

  <!-- 3 clouds with red X (outage) -->
  <g filter="url(#glow)">
    <!-- Cloud 1: OpenAI/Codex -->
    <g transform="translate(60,150)">
      <path d="M20 30 Q20 14 36 14 Q44 4 58 6 Q72 0 82 14 Q98 14 98 30 Q104 30 104 42 L20 42 Q14 42 20 30 Z" fill="url(#cloud)" stroke="#3a3f5e" stroke-width="1"/>
      <circle cx="62" cy="60" r="14" fill="url(#redX)"/>
      <path d="M55 53 L69 67 M69 53 L55 67" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9aa3c7">OpenAI</text>
    </g>

    <!-- Cloud 2: Anthropic/Claude -->
    <g transform="translate(60,260)">
      <path d="M20 30 Q20 14 36 14 Q44 4 58 6 Q72 0 82 14 Q98 14 98 30 Q104 30 104 42 L20 42 Q14 42 20 30 Z" fill="url(#cloud)" stroke="#3a3f5e" stroke-width="1"/>
      <circle cx="62" cy="60" r="14" fill="url(#redX)"/>
      <path d="M55 53 L69 67 M69 53 L55 67" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9aa3c7">Anthropic</text>
    </g>

    <!-- Cloud 3: xAI/Grok -->
    <g transform="translate(60,360)">
      <path d="M20 26 Q20 12 34 12 Q42 4 54 6 Q66 0 76 12 Q90 12 90 26 Q96 26 96 36 L20 36 Q14 36 20 26 Z" fill="url(#cloud)" stroke="#3a3f5e" stroke-width="1"/>
      <circle cx="56" cy="54" r="12" fill="url(#redX)"/>
      <path d="M50 48 L62 60 M62 48 L50 60" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <text x="56" y="84" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9aa3c7">xAI</text>
    </g>
  </g>

  <!-- outage timestamp -->
  <g font-family="-apple-system, sans-serif" fill="#ff6b6b">
    <text x="200" y="140" font-size="11">⚠ 3h 40min 全球宕机</text>
  </g>

  <!-- center: 3 racing models -->
  <g transform="translate(280,140)" font-family="-apple-system, sans-serif">
    <text x="0" y="0" font-size="12" fill="#9aa3c7" letter-spacing="2">CODING MODELS — DAILY RACING</text>

    <!-- Google Gemini 3.8 Flash -->
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="170" height="62" rx="10" fill="#1d2350" stroke="#3a4ba0" stroke-width="1.5"/>
      <circle cx="22" cy="31" r="14" fill="#4285f4"/>
      <text x="22" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">G</text>
      <text x="46" y="24" font-size="12" font-weight="600" fill="#ffffff">Gemini 3.8 Flash</text>
      <text x="46" y="42" font-size="10" fill="#9aa3c7">DeepSWE 73.7%</text>
      <text x="46" y="56" font-size="10" fill="#5ee0ff">$0.75/$3.75 · TB2.1 90.8%</text>
    </g>

    <!-- Meta Muse Spark 1.3 -->
    <g transform="translate(0,94)">
      <rect x="0" y="0" width="170" height="62" rx="10" fill="#1d2350" stroke="#7c3aed" stroke-width="1.5"/>
      <circle cx="22" cy="31" r="14" fill="#7c3aed"/>
      <path d="M14 31 L20 37 L30 25" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="24" font-size="12" font-weight="600" fill="#ffffff">Muse Spark 1.3</text>
      <text x="46" y="42" font-size="10" fill="#9aa3c7">DeepSWE 75.4% · #3</text>
      <text x="46" y="56" font-size="10" fill="#5ee0ff">tokens -25% · tools -20%</text>
    </g>

    <!-- Qwen 3.8-Max-0902 -->
    <g transform="translate(0,168)">
      <rect x="0" y="0" width="170" height="62" rx="10" fill="#1d2350" stroke="#22a06b" stroke-width="1.5"/>
      <circle cx="22" cy="31" r="14" fill="#22a06b"/>
      <text x="22" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">千</text>
      <text x="46" y="24" font-size="12" font-weight="600" fill="#ffffff">Qwen3.8-Max-0902</text>
      <text x="46" y="42" font-size="10" fill="#9aa3c7">CodeArena WebDev #1</text>
      <text x="46" y="56" font-size="10" fill="#5ee0ff">2.4T · 1M ctx · $2/$6</text>
    </g>
  </g>

  <!-- racing arrows -->
  <g stroke="url(#amber)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M460 175 L500 175" />
    <polygon points="500,171 508,175 500,179" fill="url(#amber)" stroke="none"/>
    <path d="M460 250 L500 250" />
    <polygon points="500,246 508,250 500,254" fill="url(#amber)" stroke="none"/>
    <path d="M460 324 L500 324" />
    <polygon points="500,320 508,324 500,328" fill="url(#amber)" stroke="none"/>
  </g>

  <!-- right: humanoid silhouette + starling text -->
  <g transform="translate(550,140)">
    <text x="0" y="0" font-size="12" fill="#9aa3c7" font-family="-apple-system, sans-serif" letter-spacing="2">EMBODIED AI</text>

    <!-- starling humanoid -->
    <g transform="translate(40,30)" filter="url(#glow)">
      <!-- head -->
      <circle cx="40" cy="30" r="20" fill="url(#cyan)"/>
      <circle cx="40" cy="30" r="14" fill="#0b1023"/>
      <circle cx="40" cy="30" r="6" fill="url(#cyan)"/>
      <!-- body -->
      <rect x="22" y="52" width="36" height="56" rx="14" fill="url(#cyan)"/>
      <!-- arms -->
      <rect x="6" y="58" width="14" height="44" rx="7" fill="url(#cyan)"/>
      <rect x="60" y="58" width="14" height="44" rx="7" fill="url(#cyan)"/>
      <!-- legs -->
      <rect x="26" y="108" width="14" height="48" rx="7" fill="url(#cyan)"/>
      <rect x="40" y="108" width="14" height="48" rx="7" fill="url(#cyan)"/>
      <!-- chest logo: brain dot -->
      <circle cx="40" cy="78" r="6" fill="#0b1023"/>
      <circle cx="40" cy="78" r="3" fill="url(#amber)"/>
    </g>

    <!-- label -->
    <text x="80" y="220" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#ffffff">银河星仔 · 原生智能体</text>
    <text x="80" y="240" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5ee0ff">9/3 开启预订 · 1230mm · 30kg</text>
    <text x="80" y="258" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#9aa3c7">AstraBrain-WBC 小脑基模</text>

    <!-- OpenAI humanoid pill -->
    <g transform="translate(0,275)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#1d2350" stroke="#3a4ba0" stroke-width="1"/>
      <text x="14" y="20" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#ffffff">Sam Altman 首次确认</text>
      <text x="124" y="20" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#5ee0ff">OpenAI 做人形机器人</text>
    </g>
  </g>

  <!-- bottom strip -->
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <rect x="0" y="410" width="800" height="40" fill="#0a0e1d"/>
    <text x="40" y="436" font-size="12" fill="#9aa3c7">3 大云端集体宕机 3h40m</text>
    <text x="280" y="436" font-size="12" fill="#9aa3c7">DeepSWE 一夜洗牌</text>
    <text x="460" y="436" font-size="12" fill="#9aa3c7">具身原生智能体首次商业化</text>
    <text x="700" y="436" font-size="12" fill="#ff6b6b" font-weight="600">littlepug</text>
  </g>
</svg>
