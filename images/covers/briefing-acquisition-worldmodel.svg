  <text x="48" y="130" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#1e1e2f">Acquisition &amp; World Models</text>
  <text x="48" y="175" font-family="system-ui,sans-serif" font-size="20" fill="#5b21b6">OpenAI Ona / Agent SDK / ω-EVA</text>
  <!-- Globe / world model -->
