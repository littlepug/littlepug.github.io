<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#141a3d"/>
      <stop offset="100%" stop-color="#1c1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- left: dots agent network -->
  <circle cx="205" cy="200" r="120" fill="url(#glow)"/>
  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7">
    <line x1="205" y1="200" x2="130" y2="130"/>
    <line x1="205" y1="200" x2="290" y2="125"/>
    <line x1="205" y1="200" x2="120" y2="265"/>
    <line x1="205" y1="200" x2="295" y2="272"/>
    <line x1="205" y1="200" x2="205" y2="95"/>
  </g>
  <g fill="#9b6bff">
    <circle cx="130" cy="130" r="7"/>
    <circle cx="290" cy="125" r="7"/>
    <circle cx="120" cy="265" r="7"/>
    <circle cx="295" cy="272" r="7"/>
  </g>
  <circle cx="205" cy="200" r="16" fill="#4f8cff"/>
  <circle cx="205" cy="95" r="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="205" cy="200" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- center: chip GPT-6.1 Sol -->
  <g transform="translate(390,150)">
    <rect x="-62" y="-42" width="124" height="84" rx="12" fill="#0e1430" stroke="url(#accent)" stroke-width="2"/>
    <g stroke="url(#accent)" stroke-width="2">
      <line x1="-30" y1="-42" x2="-30" y2="-56"/><line x1="0" y1="-42" x2="0" y2="-56"/><line x1="30" y1="-42" x2="30" y2="-56"/>
      <line x1="-30" y1="42" x2="-30" y2="56"/><line x1="0" y1="42" x2="0" y2="56"/><line x1="30" y1="42" x2="30" y2="56"/>
      <line x1="-62" y1="-14" x2="-76" y2="-14"/><line x1="-62" y1="14" x2="-76" y2="14"/>
      <line x1="62" y1="-14" x2="76" y2="-14"/><line x1="62" y1="14" x2="76" y2="14"/>
    </g>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">GPT-6.1</text>
    <text x="0" y="18" text-anchor="middle" fill="#8fb4ff" font-family="Helvetica, Arial, sans-serif" font-size="16">Sol</text>
  </g>
  <!-- cloud -->
  <g transform="translate(400,285)" fill="none" stroke="#8fb4ff" stroke-width="2.5" stroke-opacity="0.9">
    <path d="M-28 14 a12 12 0 0 1 2 -24 a16 16 0 0 1 30 -6 a13 13 0 0 1 24 8 a11 11 0 0 1 -2 22 z" fill="#0e1430"/>
  </g>
  <text x="400" y="340" text-anchor="middle" fill="#8fb4ff" font-family="Helvetica, Arial, sans-serif" font-size="14" opacity="0.9">Codex · Cloud</text>

  <!-- right: humanoid silhouette -->
  <g fill="#c9b6ff" opacity="0.92">
    <circle cx="640" cy="128" r="20"/>
    <rect x="628" y="152" width="24" height="10" rx="4"/>
    <rect x="622" y="164" width="36" height="76" rx="12"/>
    <rect x="604" y="168" width="14" height="60" rx="7"/>
    <rect x="662" y="168" width="14" height="60" rx="7"/>
    <rect x="626" y="244" width="12" height="66" rx="6"/>
    <rect x="642" y="244" width="12" height="66" rx="6"/>
  </g>
  <g stroke="#9b6bff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M640 96 v-14 M640 82 h56"/>
    <circle cx="700" cy="82" r="4" fill="#9b6bff"/>
  </g>
  <text x="640" y="342" text-anchor="middle" fill="#c9b6ff" font-family="Helvetica, Arial, sans-serif" font-size="14" opacity="0.9">Embodied AI</text>

  <!-- title -->
  <text x="46" y="394" fill="#ffffff" font-family="PingFang SC, Helvetica, sans-serif" font-size="30" font-weight="bold">DevDay 常驻智能体与物理 AI 拐点</text>
  <text x="46" y="420" fill="#8fa8d8" font-family="Helvetica, Arial, sans-serif" font-size="14">AI Coding · Embodied Intelligence Briefing · 2026-10-23</text>

  <!-- corner accent -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accent)"/>
</svg>
