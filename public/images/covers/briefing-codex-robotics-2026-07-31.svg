<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="robot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- abstract code/agent left side -->
  <g transform="translate(60, 80)" opacity="0.9">
    <rect x="0" y="0" width="320" height="280" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <rect x="20" y="20" width="280" height="32" rx="6" fill="#1e293b"/>
    <circle cx="36" cy="36" r="5" fill="#ef4444"/>
    <circle cx="52" cy="36" r="5" fill="#f59e0b"/>
    <circle cx="68" cy="36" r="5" fill="#22c55e"/>

    <!-- /goal command -->
    <text x="40" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#38bdf8">/goal</text>
    <text x="100" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#94a3b8">implement auth module</text>

    <!-- code lines -->
    <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="40" y="130">01  plan: [verify, route, test]</text>
      <text x="40" y="158">02  tasks: 12 pending</text>
      <text x="40" y="186">03  running: locked_computer_use</text>
      <text x="40" y="214">04  status: active 4h 32m</text>
    </g>

    <!-- progress bar -->
    <rect x="40" y="246" width="240" height="8" rx="4" fill="#1e293b"/>
    <rect x="40" y="246" width="156" height="8" rx="4" fill="url(#accent)"/>
  </g>

  <!-- humanoid robot right side -->
  <g transform="translate(480, 60)">
    <!-- head -->
    <rect x="60" y="0" width="80" height="70" rx="18" fill="url(#robot)"/>
    <rect x="78" y="22" width="18" height="10" rx="3" fill="#0f172a"/>
    <rect x="108" y="22" width="18" height="10" rx="3" fill="#0f172a"/>
    <rect x="85" y="44" width="30" height="4" rx="2" fill="#38bdf8"/>

    <!-- neck -->
    <rect x="85" y="70" width="30" height="24" rx="6" fill="#94a3b8"/>

    <!-- torso -->
    <rect x="45" y="94" width="110" height="130" rx="20" fill="url(#robot)"/>
    <rect x="70" y="120" width="60" height="60" rx="12" fill="#0f172a"/>
    <circle cx="100" cy="150" r="14" fill="url(#accent)" opacity="0.9"/>

    <!-- arms -->
    <rect x="-10" y="110" width="40" height="110" rx="14" fill="#cbd5e1"/>
    <rect x="160" y="110" width="40" height="110" rx="14" fill="#cbd5e1"/>
    <circle cx="10" cy="120" r="16" fill="#64748b"/>
    <circle cx="180" cy="120" r="16" fill="#64748b"/>

    <!-- legs -->
    <rect x="55" y="224" width="36" height="120" rx="12" fill="#cbd5e1"/>
    <rect x="109" y="224" width="36" height="120" rx="12" fill="#cbd5e1"/>

    <!-- joints -->
    <circle cx="73" cy="230" r="14" fill="#64748b"/>
    <circle cx="127" cy="230" r="14" fill="#64748b"/>

    <!-- watering can in hand -->
    <g transform="translate(150, 210) rotate(-15)">
      <path d="M0,0 L40,0 L45,30 L-5,30 Z" fill="#38bdf8" opacity="0.9"/>
      <rect x="42" y="2" width="24" height="6" rx="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- connecting flow -->
  <path d="M380 220 Q430 220 460 200" stroke="url(#accent)" stroke-width="3" fill="none" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- bottom title -->
  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#f8fafc">AI 编程 · 具身智能 每日简报</text>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">2026-07-31</text>
</svg>