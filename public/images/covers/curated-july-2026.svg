<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="#3b82f6" opacity="0.08"/>
  <circle cx="700" cy="350" r="180" fill="#2563eb" opacity="0.06"/>
  <circle cx="100" cy="400" r="100" fill="#60a5fa" opacity="0.05"/>
  <circle cx="400" cy="420" r="60" fill="#3b82f6" opacity="0.04"/>

  <!-- Grid dots pattern -->
  <g opacity="0.08">
    <circle cx="50" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="150" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="250" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="350" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="450" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="550" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="650" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="750" cy="50" r="1.5" fill="#60a5fa"/>
    <circle cx="100" cy="200" r="1.5" fill="#60a5fa"/>
    <circle cx="300" cy="200" r="1.5" fill="#60a5fa"/>
    <circle cx="500" cy="200" r="1.5" fill="#60a5fa"/>
    <circle cx="700" cy="200" r="1.5" fill="#60a5fa"/>
    <circle cx="200" cy="350" r="1.5" fill="#60a5fa"/>
    <circle cx="400" cy="350" r="1.5" fill="#60a5fa"/>
    <circle cx="600" cy="350" r="1.5" fill="#60a5fa"/>
  </g>

  <!-- Code brackets decoration -->
  <g transform="translate(580, 180)" opacity="0.12">
    <text font-family="monospace" font-size="80" fill="#93c5fd" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Main title -->
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">
    七月中旬技术精选
  </text>

  <!-- Subtitle line 1 -->
  <text x="60" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    pgrust · Deep Code CLI · Spring AI Alibaba
  </text>

  <!-- Subtitle line 2 -->
  <text x="60" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">
    虚拟线程调优 · Kafka 4.4 前瞻 · 开源编码模型
  </text>

  <!-- Divider line -->
  <line x1="60" y1="280" x2="300" y2="280" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>

  <!-- Date badge -->
  <rect x="60" y="300" width="140" height="36" rx="18" fill="#3b82f6" opacity="0.15"/>
  <text x="130" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#93c5fd" text-anchor="middle" font-weight="600">
    2026.07.15
  </text>

  <!-- Bottom labels -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="72" height="24" rx="6" fill="#3b82f6" opacity="0.12"/>
    <text x="36" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">AI Agent</text>

    <rect x="82" y="0" width="56" height="24" rx="6" fill="#3b82f6" opacity="0.12"/>
    <text x="110" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Java</text>

    <rect x="148" y="0" width="60" height="24" rx="6" fill="#3b82f6" opacity="0.12"/>
    <text x="178" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">BigData</text>

    <rect x="218" y="0" width="80" height="24" rx="6" fill="#3b82f6" opacity="0.12"/>
    <text x="258" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Open Source</text>
  </g>

  <!-- Blog name -->
  <text x="60" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" font-weight="500">
    littlepug 技术博客 · curated
  </text>
</svg>
