<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="0.55" stop-color="#16283f"/>
      <stop offset="1" stop-color="#0b2239"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e344d"/>
      <stop offset="1" stop-color="#17293e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- grid backdrop -->
  <g stroke="#22384f" stroke-width="1" opacity="0.5">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- title -->
  <text x="48" y="76" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">行业快讯 · 2026-09-20</text>
  <text x="48" y="112" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#8fb3d9">信任危机、标准收敛与具身规模化</text>
  <rect x="48" y="128" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Card 1: ZCode privacy / shield -->
  <g>
    <rect x="48" y="160" width="216" height="180" rx="14" fill="url(#panel)" stroke="#2c4a6b"/>
    <!-- shield -->
    <path d="M156 190 l30 12 v26 c0 22 -13 36 -30 44 c-17 -8 -30 -22 -30 -44 v-26 z" fill="none" stroke="#f87171" stroke-width="4"/>
    <line x1="146" y1="222" x2="166" y2="242" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
    <line x1="166" y1="222" x2="146" y2="242" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
    <text x="156" y="300" text-anchor="middle" font-family="'PingFang SC',Arial,sans-serif" font-size="15" fill="#dbeafe">ZCode 隐私风波</text>
    <text x="156" y="322" text-anchor="middle" font-family="'PingFang SC',Arial,sans-serif" font-size="12" fill="#7ea6cf">静默上传 · 致歉 · 承诺开源</text>
  </g>

  <!-- Card 2: AGENTS.md convergence -->
  <g>
    <rect x="292" y="160" width="216" height="180" rx="14" fill="url(#panel)" stroke="#2c4a6b"/>
    <!-- three files merging into one -->
    <g font-family="Menlo,monospace" font-size="11">
      <rect x="316" y="192" width="52" height="34" rx="5" fill="#0e2236" stroke="#4fc3f7"/>
      <text x="342" y="213" text-anchor="middle" fill="#4fc3f7">CC</text>
      <rect x="380" y="192" width="52" height="34" rx="5" fill="#0e2236" stroke="#fbbf24"/>
      <text x="406" y="213" text-anchor="middle" fill="#fbbf24">Cdx</text>
      <rect x="444" y="192" width="52" height="34" rx="5" fill="#0e2236" stroke="#a78bfa"/>
      <text x="470" y="213" text-anchor="middle" fill="#a78bfa">Cur</text>
    </g>
    <path d="M342 230 C342 250 400 244 400 262 M406 230 C406 250 400 246 400 262 M470 230 C470 250 400 244 400 262" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    <rect x="362" y="264" width="76" height="36" rx="6" fill="#0e2236" stroke="#34d399" stroke-width="2"/>
    <text x="400" y="287" text-anchor="middle" font-family="Menlo,monospace" font-size="12" fill="#34d399">AGENTS.md</text>
    <text x="400" y="326" text-anchor="middle" font-family="'PingFang SC',Arial,sans-serif" font-size="12" fill="#7ea6cf">跨厂商项目指令标准收敛</text>
  </g>

  <!-- Card 3: Toyota factory robot -->
  <g>
    <rect x="536" y="160" width="216" height="180" rx="14" fill="url(#panel)" stroke="#2c4a6b"/>
    <!-- wheeled robot -->
    <g stroke="#5eead4" stroke-width="3" fill="none">
      <rect x="590" y="210" width="84" height="58" rx="10"/>
      <line x1="632" y1="210" x2="632" y2="196"/>
      <circle cx="632" cy="190" r="7"/>
      <path d="M610 226 h44" stroke-width="2"/>
    </g>
    <circle cx="610" cy="278" r="10" fill="none" stroke="#5eead4" stroke-width="3"/>
    <circle cx="654" cy="278" r="10" fill="none" stroke="#5eead4" stroke-width="3"/>
    <text x="644" y="310" text-anchor="middle" font-family="'PingFang SC',Arial,sans-serif" font-size="12" fill="#7ea6cf">丰田 40 万台 ELEY</text>
    <text x="644" y="328" text-anchor="middle" font-family="'PingFang SC',Arial,sans-serif" font-size="11" fill="#7ea6cf">60 座工厂 · 年投 1 万亿日元</text>
  </g>

  <!-- bottom meta -->
  <text x="48" y="392" font-family="'PingFang SC',Arial,sans-serif" font-size="14" fill="#5f86ad">AI Coding · 具身智能 · littlepug.tech</text>
  <rect x="48" y="406" width="704" height="1" fill="#22384f"/>
</svg>
